# Kubernetes マニフェスト検証
# kustomize build + kubeconform でスキーマ検証
name: Validate Manifests

# paths フィルタは付けない: dependabot が .github/workflows/ を更新した PR でも
# CI を走らせ、required status check (validate) が必ず実行されるようにするため
# (paths で kubernetes/** に絞ると github-actions 更新 PR で CI が発火せず
#  auto-merge が永久に BLOCK される)。
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin

      - name: Validate proxy
        run: |
          echo "=== Proxy ==="
          kubectl kustomize kubernetes/proxy/ | kubeconform -strict -summary

      - name: Validate lobby overlay
        run: |
          echo "=== Lobby ==="
          kubectl kustomize kubernetes/overlays/lobby/ | kubeconform -strict -summary

      - name: Validate survival overlay
        run: |
          echo "=== Survival ==="
          kubectl kustomize kubernetes/overlays/survival/ | kubeconform \
            -strict \
            -summary \
            -skip ServiceMonitor
