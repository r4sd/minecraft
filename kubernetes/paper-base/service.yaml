# Paper サーバー共通 Service
# ClusterIP（内部のみ）- Velocity からの接続を受ける
apiVersion: v1
kind: Service
metadata:
  name: paper
  namespace: minecraft
  labels:
    app: paper
    component: server
spec:
  type: ClusterIP
  selector:
    app: paper
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
    - name: rcon
      port: 25575
      targetPort: 25575
      protocol: TCP
