# Paper サーバー共通 Service
# ClusterIP（内部のみ）- Velocity からの接続を受ける
# RCON (25575) は Service に載せない。サイドカー(mc-backup, exporter)は localhost 経由で接続するため不要。
# クラスタ外からの RCON 操作が必要な場合は `kubectl exec -it pod -- rcon-cli` を使用。
apiVersion: v1
kind: Service
metadata:
  name: paper
  namespace: minecraft
  labels:
    app: paper
    component: server
spec:
  type: ClusterIP
  selector:
    app: paper
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
