# Minecraft サーバー StatefulSet
# mc-backup (バックアップ) + minecraft-exporter (監視) サイドカー付き
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  serviceName: minecraft
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      # セキュリティ設定
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        # メインコンテナ: Minecraft サーバー
        - name: minecraft
          image: itzg/minecraft-server:latest
          ports:
            - containerPort: 25565
              name: minecraft
            - containerPort: 25575
              name: rcon
          envFrom:
            - configMapRef:
                name: minecraft-config
            - secretRef:
                name: minecraft-secrets
          resources:
            requests:
              memory: "4Gi"
              cpu: "1000m"
            limits:
              memory: "5Gi"
              cpu: "2000m"
          # ヘルスチェック
          livenessProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: minecraft-data
              mountPath: /data
            - name: minecraft-backups
              mountPath: /backups
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

        # サイドカー: バックアップ (mc-backup)
        - name: mc-backup
          image: itzg/mc-backup:latest
          env:
            - name: BACKUP_INTERVAL
              value: "24h"
            - name: PRUNE_BACKUPS_DAYS
              value: "7"
            - name: BACKUP_METHOD
              value: "tar"
            - name: COMPRESS_METHOD
              value: "gzip"
            - name: PAUSE_IF_NO_PLAYERS
              value: "true"
            - name: EXCLUDES
              value: "*.jar,cache,logs,libraries,versions"
            - name: RCON_HOST
              value: "localhost"
            - name: RCON_PORT
              value: "25575"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: RCON_PASSWORD
          volumeMounts:
            - name: minecraft-data
              mountPath: /data
              readOnly: true
            - name: minecraft-backups
              mountPath: /backups
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

        # サイドカー: メトリクス収集 (minecraft-exporter)
        - name: minecraft-exporter
          image: joshi425/minecraft-exporter:latest
          ports:
            - containerPort: 9225
              name: metrics
          env:
            - name: MC_RCON_ADDRESS
              value: "localhost:25575"
            - name: MC_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: RCON_PASSWORD
          volumeMounts:
            - name: minecraft-data
              mountPath: /world
              subPath: world
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: minecraft-data
          persistentVolumeClaim:
            claimName: minecraft-data
        - name: minecraft-backups
          persistentVolumeClaim:
            claimName: minecraft-backups
