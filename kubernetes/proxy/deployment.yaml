# Velocity Proxy Deployment
# ステートレスなのでStatefulSetではなくDeploymentを使用
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity
  namespace: minecraft
  labels:
    app: velocity
    component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velocity
  template:
    metadata:
      labels:
        app: velocity
        component: proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: velocity
          image: itzg/bungeecord:java21
          env:
            - name: TYPE
              value: "VELOCITY"
            - name: MEMORY
              value: "512m"
          ports:
            - containerPort: 25565
              name: minecraft
          volumeMounts:
            - name: velocity-config
              mountPath: /server/velocity.toml
              subPath: velocity.toml
            - name: forwarding-secret
              mountPath: /server/forwarding.secret
              subPath: forwarding.secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 15
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: velocity-config
          configMap:
            name: velocity-config
        - name: forwarding-secret
          secret:
            secretName: forwarding-secret
