# Minecraft サーバー設定（非機密情報）
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-config
  namespace: minecraft
data:
  # 基本設定
  EULA: "TRUE"
  TZ: "Asia/Tokyo"

  # サーバータイプとバージョン
  TYPE: "PAPER"
  VERSION: "LATEST"

  # メモリ設定
  MEMORY: "4G"

  # サーバー設定
  DIFFICULTY: "normal"
  MODE: "survival"
  MOTD: "Welcome to Minecraft Server!"
  MAX_PLAYERS: "20"
  VIEW_DISTANCE: "10"
  LEVEL_TYPE: "minecraft:normal"

  # パフォーマンス最適化
  USE_AIKAR_FLAGS: "true"

  # 自動停止機能（プレイヤー不在時にサーバー停止）
  ENABLE_AUTOSTOP: "TRUE"
  AUTOSTOP_TIMEOUT_EST: "3600"
  AUTOSTOP_TIMEOUT_INIT: "1800"
  AUTOSTOP_PERIOD: "10"

  # プラグイン自動ダウンロード（Spiget）
  # ImageOnMap: 26585, DiscordSRV: 18494
  SPIGET_RESOURCES: "26585,18494"

  # RCON有効化（管理用）
  ENABLE_RCON: "true"
  RCON_PORT: "25575"
